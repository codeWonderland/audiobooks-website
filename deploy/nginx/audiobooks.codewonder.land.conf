# nginx site config for the Audiobooks marketing site — audiobooks.codewonder.land
#
# Modeled on the existing `nbp` site on this server, minus the Strapi backend
# (this is a purely static Vite/React build).
#
# This is the pre-certbot (:80 only) version so `nginx -t` passes before any
# certificate exists. Once installed and DNS points here, run:
#
#     sudo certbot --nginx -d audiobooks.codewonder.land
#
# certbot rewrites this file to add the :443 block + the HTTP->HTTPS redirect.
#
# Layout:
#   /  -> static React/Vite build in /var/www/audiobooks  (SPA: fall back to index.html)

server {
    server_name audiobooks.codewonder.land;

    # Let's Encrypt HTTP-01 challenge (shared webroot, as with the other sites).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    access_log /var/log/nginx/audiobooks.access.log;
    error_log  /var/log/nginx/audiobooks.error.log warn;

    # --- Static frontend (React / Vite build) ---
    root /var/www/audiobooks;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted asset bundle.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 80;
    listen [::]:80;
}
